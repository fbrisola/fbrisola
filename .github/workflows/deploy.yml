name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via rsync over SSH
        uses: easingthemes/ssh-deploy@v5.1.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_DEPLOY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          SOURCE: ./
          TARGET: ${{ secrets.SSH_TARGET }}
          # Sobrescreve arquivos enviados, mas não apaga o que existe só no servidor (sem --delete)
          ARGS: "-rlgoDvz"
          EXCLUDE: "/.git/, /.github/, /node_modules/, /TODO.md, /pass.php, /index-v1.html, /index-v2.html, /fbb.html"
